<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" aria-label="Avocado Sourdough Toast">
  <defs>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C48046" />
      <stop offset="100%" stop-color="#5A3821" />
    </linearGradient>
    <linearGradient id="avocadoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8D5BA" />
      <stop offset="100%" stop-color="#4E8752" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" fill="#F3E9DF" />
  <circle cx="200" cy="150" r="120" fill="#FAF6F0" opacity="0.7" />

  <!-- Wooden Cutting Board / Serving Paddle -->
  <ellipse cx="200" cy="220" rx="145" ry="42" fill="#3D2314" opacity="0.15" />
  <rect x="75" y="100" width="250" height="110" rx="20" fill="#DDB892" stroke="#8C4E23" stroke-width="3" />
  <!-- Paddle Handle -->
  <path d="M 75 145 L 35 145 C 28 145 28 165 35 165 L 75 165" fill="#DDB892" stroke="#8C4E23" stroke-width="3" />
  <circle cx="48" cy="155" r="5" fill="#FAF6F0" stroke="#8C4E23" stroke-width="2" />

  <!-- Sourdough Slice -->
  <path d="M 125 110 C 160 95 240 95 275 110 C 290 145 285 180 270 195 C 235 205 165 205 130 195 C 115 180 110 145 125 110 Z" fill="#F6EDE3" stroke="#5A3821" stroke-width="6" />

  <!-- Mashed Avocado Layer -->
  <path d="M 135 120 C 165 108 235 108 265 120 C 275 145 272 175 260 188 C 230 196 170 196 140 188 C 128 175 125 145 135 120 Z" fill="url(#avocadoGrad)" />

  <!-- Avocado Slices Fan -->
  <g fill="#7FB069" stroke="#4E8752" stroke-width="2">
    <path d="M 150 140 C 170 120 200 125 210 145 C 190 160 165 155 150 140 Z" />
    <path d="M 175 142 C 195 122 225 127 235 147 C 215 162 190 157 175 142 Z" />
    <path d="M 200 144 C 220 124 250 129 260 149 C 240 164 215 159 200 144 Z" />
  </g>

  <!-- Cherry Tomato Halves -->
  <circle cx="160" cy="165" r="12" fill="#D94E34" stroke="#9C2C18" stroke-width="2" />
  <ellipse cx="160" cy="165" rx="8" ry="4" fill="#E86E58" />
  
  <circle cx="240" cy="135" r="12" fill="#D94E34" stroke="#9C2C18" stroke-width="2" />
  <ellipse cx="240" cy="135" rx="8" ry="4" fill="#E86E58" />

  <!-- Red Pepper Flakes & Sesame Seeds -->
  <g fill="#9C2C18">
    <circle cx="180" cy="135" r="2" />
    <circle cx="195" cy="140" r="2.5" />
    <circle cx="220" cy="148" r="2" />
    <circle cx="170" cy="150" r="2" />
    <circle cx="215" cy="165" r="2.5" />
  </g>
  <g fill="#FAF6F0">
    <ellipse cx="190" cy="130" rx="2" ry="1.2" transform="rotate(20 190 130)" />
    <ellipse cx="205" cy="155" rx="2" ry="1.2" transform="rotate(-30 205 155)" />
    <ellipse cx="175" cy="160" rx="2" ry="1.2" transform="rotate(45 175 160)" />
    <ellipse cx="230" cy="140" rx="2" ry="1.2" transform="rotate(10 230 140)" />
  </g>
</svg>
