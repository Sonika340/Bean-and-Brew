<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" aria-label="Velvet Espresso Tiramisu">
  <defs>
    <linearGradient id="creamLayer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDFBF7" />
    </linearGradient>
    <linearGradient id="spongeLayer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C48046" />
      <stop offset="100%" stop-color="#5A3821" />
    </linearGradient>
    <linearGradient id="cocoaTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2E1B" />
      <stop offset="100%" stop-color="#23140C" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" fill="#F3E9DF" />
  <circle cx="200" cy="150" r="120" fill="#FAF6F0" opacity="0.7" />

  <!-- Dessert Plate -->
  <ellipse cx="200" cy="230" rx="145" ry="42" fill="#3D2314" opacity="0.15" />
  <ellipse cx="200" cy="222" rx="140" ry="38" fill="#FFFFFF" stroke="#CBB49E" stroke-width="2.5" />
  <ellipse cx="200" cy="222" rx="122" ry="30" fill="#FDFBF7" />

  <!-- Tiramisu Slice 3D Isometric View -->
  <!-- Base Sponge Layer (Espresso Soaked) -->
  <path d="M 120 185 L 210 215 L 280 180 L 190 150 Z" fill="url(#spongeLayer)" stroke="#3D2314" stroke-width="1.5" />
  <path d="M 120 185 L 120 205 L 210 235 L 210 215 Z" fill="#3D2314" />
  <path d="M 210 215 L 210 235 L 280 200 L 280 180 Z" fill="#23140C" />

  <!-- Middle Mascarpone Cream Layer -->
  <path d="M 120 160 L 210 190 L 280 155 L 190 125 Z" fill="url(#creamLayer)" stroke="#E5D5C5" stroke-width="1" />
  <path d="M 120 160 L 120 185 L 210 215 L 210 190 Z" fill="#F3E9DF" />
  <path d="M 210 190 L 210 215 L 280 180 L 280 155 Z" fill="#E5D5C5" />

  <!-- Second Sponge Layer -->
  <path d="M 120 135 L 210 165 L 280 130 L 190 100 Z" fill="url(#spongeLayer)" stroke="#3D2314" stroke-width="1.5" />
  <path d="M 120 135 L 120 160 L 210 190 L 210 165 Z" fill="#4A2E1B" />
  <path d="M 210 165 L 210 190 L 280 155 L 280 130 Z" fill="#3D2314" />

  <!-- Top Mascarpone Cream Layer (Dollops) -->
  <path d="M 120 110 L 210 140 L 280 105 L 190 75 Z" fill="url(#creamLayer)" stroke="#CBB49E" stroke-width="1.5" />
  <path d="M 120 110 L 120 135 L 210 165 L 210 140 Z" fill="#FAF6F0" />
  <path d="M 210 140 L 210 165 L 280 130 L 280 105 Z" fill="#F3E9DF" />

  <!-- Piping Cream Puffs on Top Surface -->
  <g fill="#FAF6F0" stroke="#E5D5C5" stroke-width="1.5">
    <ellipse cx="150" cy="115" rx="14" ry="10" />
    <ellipse cx="175" cy="125" rx="14" ry="10" />
    <ellipse cx="200" cy="135" rx="14" ry="10" />
    <ellipse cx="170" cy="100" rx="14" ry="10" />
    <ellipse cx="195" cy="110" rx="14" ry="10" />
    <ellipse cx="220" cy="120" rx="14" ry="10" />
    <ellipse cx="245" cy="130" rx="14" ry="10" />
    <ellipse cx="190" cy="88" rx="14" ry="10" />
    <ellipse cx="215" cy="98" rx="14" ry="10" />
    <ellipse cx="240" cy="108" rx="14" ry="10" />
  </g>

  <!-- Dark Rich Cocoa Dusting -->
  <g fill="#3D2314" opacity="0.85">
    <circle cx="150" cy="114" r="2.5" />
    <circle cx="160" cy="118" r="2" />
    <circle cx="174" cy="124" r="3" />
    <circle cx="185" cy="128" r="2.5" />
    <circle cx="198" cy="133" r="3" />
    <circle cx="168" cy="99" r="2.5" />
    <circle cx="194" cy="109" r="3" />
    <circle cx="218" cy="119" r="2.5" />
    <circle cx="238" cy="129" r="3" />
    <circle cx="188" cy="87" r="2" />
    <circle cx="214" cy="97" r="2.5" />
    <circle cx="238" cy="107" r="2" />
    <circle cx="250" cy="118" r="2.5" />
  </g>

  <!-- Mint Leaf Garnish -->
  <path d="M 245 80 Q 260 70 270 76 Q 260 88 245 80" fill="#2A6F48" />
  <path d="M 245 80 Q 248 65 258 64 Q 256 76 245 80" fill="#3A8A5C" />
  
  <!-- Chocolate Coffee Bean on garnish -->
  <ellipse cx="235" cy="86" rx="8" ry="5.5" fill="#23140C" transform="rotate(-30 235 86)" />
  <path d="M 230 87 C 235 86 236 86 240 85" stroke="#FAF6F0" stroke-width="1.2" fill="none" />
</svg>
