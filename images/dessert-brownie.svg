<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" aria-label="Double Fudge Espresso Brownie">
  <defs>
    <linearGradient id="brownieTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2E1B" />
      <stop offset="50%" stop-color="#3D2314" />
      <stop offset="100%" stop-color="#23140C" />
    </linearGradient>
    <linearGradient id="chocolateSauce" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#23140C" />
      <stop offset="100%" stop-color="#190D07" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" fill="#F3E9DF" />
  <circle cx="200" cy="150" r="120" fill="#FAF6F0" opacity="0.7" />

  <!-- Slate Serving Plate -->
  <ellipse cx="200" cy="225" rx="140" ry="40" fill="#3D2314" opacity="0.15" />
  <rect x="70" y="180" width="260" height="50" rx="8" fill="#3D2314" stroke="#23140C" stroke-width="2" />
  <rect x="75" y="175" width="250" height="48" rx="6" fill="#4A2E1B" opacity="0.4" />

  <!-- Brownie Cube 3D Block -->
  <!-- Top Surface (Crinkly shiny crust) -->
  <path d="M 140 135 L 200 165 L 270 130 L 210 100 Z" fill="url(#brownieTop)" stroke="#23140C" stroke-width="2" />
  <!-- Left Side -->
  <path d="M 140 135 L 140 185 L 200 215 L 200 165 Z" fill="#2E180E" stroke="#23140C" stroke-width="2" />
  <!-- Right Side -->
  <path d="M 200 165 L 200 215 L 270 180 L 270 130 Z" fill="#1F1008" stroke="#23140C" stroke-width="2" />

  <!-- Crinkly top crust cracks -->
  <g stroke="#C48046" stroke-width="1.5" opacity="0.7" fill="none">
    <path d="M 160 130 Q 180 138 190 125" />
    <path d="M 180 145 Q 210 148 230 135" />
    <path d="M 205 115 Q 225 125 245 118" />
  </g>

  <!-- Chocolate Chips / Fudge Chunks inside the cut sides -->
  <g fill="#140803">
    <circle cx="160" cy="165" r="5" />
    <circle cx="185" cy="185" r="6" />
    <circle cx="155" cy="178" r="4" />
    <circle cx="225" cy="180" r="6" />
    <circle cx="250" cy="160" r="5" />
    <circle cx="235" cy="195" r="4.5" />
  </g>

  <!-- Vanilla Ice Cream Scoop on Top -->
  <circle cx="205" cy="95" r="32" fill="#FAF6F0" stroke="#E5D5C5" stroke-width="2" />
  <circle cx="205" cy="95" r="30" fill="#FFFDF9" />
  <ellipse cx="205" cy="115" rx="34" ry="12" fill="#F6EDE3" />

  <!-- Warm Fudge Drizzle running down scoop and brownie -->
  <path d="M 190 75 Q 185 95 180 115 Q 175 135 178 150" fill="none" stroke="url(#chocolateSauce)" stroke-width="5" stroke-linecap="round" />
  <path d="M 215 75 Q 225 95 220 120 Q 225 140 230 165" fill="none" stroke="url(#chocolateSauce)" stroke-width="6" stroke-linecap="round" />
  <path d="M 202 70 Q 205 90 205 125" fill="none" stroke="url(#chocolateSauce)" stroke-width="4" stroke-linecap="round" />

  <!-- Sea Salt Flakes -->
  <g fill="#FFFFFF">
    <rect x="155" y="142" width="4" height="2" transform="rotate(25 155 142)" />
    <rect x="175" y="152" width="3" height="3" transform="rotate(-15 175 152)" />
    <rect x="235" y="140" width="4" height="2" transform="rotate(35 235 140)" />
  </g>
</svg>
