<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" aria-label="Flaky Almond Croissant">
  <defs>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DE935F" />
      <stop offset="60%" stop-color="#C48046" />
      <stop offset="100%" stop-color="#8C4E23" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E5D5C5" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" fill="#F3E9DF" />
  <circle cx="200" cy="150" r="120" fill="#FAF6F0" opacity="0.7" />

  <!-- Ceramic Serving Plate -->
  <ellipse cx="200" cy="195" rx="140" ry="50" fill="#3D2314" opacity="0.15" />
  <ellipse cx="200" cy="185" rx="135" ry="45" fill="url(#plateGrad)" stroke="#CBB49E" stroke-width="2.5" />
  <ellipse cx="200" cy="185" rx="115" ry="38" fill="#FDFBF7" />

  <!-- Croissant Body (Crescent layers) -->
  <!-- Back horn tips -->
  <path d="M 100 180 C 80 160 110 135 130 145 Z" fill="#8C4E23" />
  <path d="M 300 180 C 320 160 290 135 270 145 Z" fill="#8C4E23" />

  <!-- Central Crescent curve -->
  <path d="M 95 180 C 110 120 160 95 200 95 C 240 95 290 120 305 180 C 270 195 220 205 200 205 C 180 205 130 195 95 180 Z" fill="url(#crustGrad)" stroke="#5A3821" stroke-width="3" />

  <!-- Flaky Pastry Segments -->
  <path d="M 140 120 C 150 145 160 170 155 195" stroke="#5A3821" stroke-width="3" fill="none" opacity="0.7" />
  <path d="M 175 105 C 180 135 185 170 180 204" stroke="#5A3821" stroke-width="3" fill="none" opacity="0.7" />
  <path d="M 225 105 C 220 135 215 170 220 204" stroke="#5A3821" stroke-width="3" fill="none" opacity="0.7" />
  <path d="M 260 120 C 250 145 240 170 245 195" stroke="#5A3821" stroke-width="3" fill="none" opacity="0.7" />

  <!-- Toasted Sliced Almonds on top -->
  <g fill="#FAF6F0" stroke="#8C4E23" stroke-width="1.5">
    <ellipse cx="165" cy="130" rx="9" ry="5" transform="rotate(-20 165 130)" />
    <ellipse cx="195" cy="120" rx="11" ry="6" transform="rotate(15 195 120)" />
    <ellipse cx="230" cy="125" rx="10" ry="5.5" transform="rotate(-35 230 125)" />
    <ellipse cx="180" cy="155" rx="10" ry="5" transform="rotate(40 180 155)" />
    <ellipse cx="215" cy="150" rx="11" ry="6" transform="rotate(-15 215 150)" />
    <ellipse cx="245" cy="148" rx="8" ry="4.5" transform="rotate(25 245 148)" />
    <ellipse cx="150" cy="158" rx="9" ry="5" transform="rotate(-10 150 158)" />
  </g>

  <!-- Powdered Sugar Dusting -->
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="170" cy="110" r="1.5" />
    <circle cx="185" cy="100" r="2" />
    <circle cx="210" cy="102" r="1.5" />
    <circle cx="225" cy="112" r="2" />
    <circle cx="200" cy="140" r="2.5" />
    <circle cx="160" cy="145" r="1.5" />
    <circle cx="235" cy="138" r="2" />
    <circle cx="190" cy="170" r="2" />
    <circle cx="210" cy="175" r="1.5" />
  </g>
</svg>
